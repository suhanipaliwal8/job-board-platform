{% extends "base.html" %}

{% block title %}
Login - JobBoard
{% endblock %}


{% block content %}

<div class="form-container">

    <h2>Login</h2>

    <form id="loginForm">

        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p id="loginMessage"></p>

    <p>
        Don't have an account?
        <a href="/register/">Register</a>
    </p>

</div>

{% endblock %}
