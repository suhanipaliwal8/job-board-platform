{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>{% block title %}JobBoard{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<nav class="navbar">

    <div class="nav-container">

        <a href="/" class="logo">
            JobBoard
        </a>

        <div class="nav-links">

            <a href="/">
                Home
            </a>

            <!-- Logged out -->
            <span id="authLinks">

                <a href="/login/" class="btn btn-outline">
                    Login
                </a>

                <a href="/register/" class="btn btn-primary">
                    Register
                </a>

            </span>


            <!-- Logged in -->
            <span id="userLinks" style="display: none;">

                <a href="#" id="dashboardLink" class="btn btn-outline">
                    Dashboard
                </a>

                <button id="logoutBtn" class="btn btn-primary" type="button">
                    Logout
                </button>

            </span>

        </div>

    </div>

</nav>


<main class="container">

    {% block content %}
    {% endblock %}

</main>


<script src="{% static 'js/app.js' %}"></script>


{% block scripts %}
{% endblock %}

</body>

</html>
