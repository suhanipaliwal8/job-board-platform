{% extends "base.html" %}

{% block title %}
Candidate Dashboard
{% endblock %}


{% block content %}

<h1>Candidate Dashboard</h1>

<div class="dashboard-grid">

    <section class="card">

        <h2>Profile</h2>

        <p>
            Username:
            <strong id="candidateUsername"></strong>
        </p>

        <p>
            Email:
            <strong id="candidateEmail"></strong>
        </p>

    </section>


    <section class="card">

        <h2>Upload Resume</h2>

        <form id="resumeForm">

            <input
                type="file"
                id="resumeFile"
                accept=".pdf,.doc,.docx"
                required
            >

            <button type="submit">
                Upload Resume
            </button>

        </form>

        <p id="resumeMessage"></p>

    </section>

</div>


<section class="card">

    <h2>My Applications</h2>

    <div id="applicationsContainer">

        <p>Loading applications...</p>

    </div>

</section>

{% endblock %}
