{% extends "base.html" %}

{% block title %}
Candidate Dashboard
{% endblock %}


{% block content %}

<h1>Candidate Dashboard</h1>


<div class="dashboard-grid">

    <!-- Profile -->

    <section class="card">

        <h2>Profile</h2>

        <p>
            Username:
            <strong id="candidateUsername">
                Loading...
            </strong>
        </p>

        <p>
            Email:
            <strong id="candidateEmail">
                Loading...
            </strong>
        </p>

    </section>


    <!-- Resume -->

    <section class="card">

        <h2>Upload Resume</h2>

        <form id="resumeForm">

            <input
                type="file"
                id="resumeFile"
                accept=".pdf,.doc,.docx"
                required
            >

            <button type="submit">
                Upload Resume
            </button>

        </form>

        <p id="resumeMessage"></p>

    </section>

</div>


<!-- Browse Jobs -->

<section class="card dashboard-section">

    <div class="section-header">

        <h2>Browse Jobs</h2>

        <a
            href="/"
            class="btn btn-primary"
        >
            Browse All Jobs
        </a>

    </div>


    <div
        id="candidate-jobs"
        class="job-grid"
    >

        <p>
            Loading jobs...
        </p>

    </div>

</section>


<!-- My Applications -->

<section class="card dashboard-section">

    <h2>
        My Applications
    </h2>

    <div id="applicationsContainer">

        <p>
            Loading applications...
        </p>

    </div>

</section>

{% endblock %}
